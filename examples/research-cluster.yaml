# ════════════════════════════════════════════════════════════════════════════
# Research cluster — 3 Cloudflare Workers (global edge) + 1 canonical server
#
# Reads served from the closest CF POP. Writes are replicated to the
# server and re-coalesced to the workers.
# ════════════════════════════════════════════════════════════════════════════

fleet:
  id: research-cluster
  region: global

discovery:
  bonjour: false
  static: ./research-cluster.yaml

routing:
  preferLocality: true
  localityKey: region
  loadBalance: least_loaded
  tierPreference: [4, 5]   # try CF first, then server

quorum:
  default: 2
  critical:
    - vault.lock
    - auth.token

scaling:
  name: schedule
  schedule:
    - { at: '00:00', tier: cloudflare, count: 3 }
    - { at: '12:00', tier: cloudflare, count: 5 }

health:
  intervalMs: 10_000
  timeoutMs: 1500
  degradedLatencyMs: 100   # CF should be < 100ms worldwide

instances:
  # ── Tier 4: Cloudflare edge ────────────────────────────────────────
  - { name: cf-edge-eu,   tier: cloudflare, endpoint: https://quilt-eu.research.workers.dev,   region: eu-west-1 }
  - { name: cf-edge-us,   tier: cloudflare, endpoint: https://quilt-us.research.workers.dev,   region: us-east-1 }
  - { name: cf-edge-apac, tier: cloudflare, endpoint: https://quilt-apac.research.workers.dev, region: ap-south-1 }

  # ── Tier 5: Canonical server (holds vectorize index) ───────────────
  - name: server-canon
    tier: server
    endpoint: grpc://canon.research.internal:7070
    transport: grpc
    region: us-east-1
    capabilities:
      ram_mb: 262144
      cpu_cores: 64
      cuda: true
      storage_bytes: 10995116277760

cells:
  vector.embedding: { tierPreference: [server, cloudflare], quorum: 3 }
  prompt.template:  { tierPreference: [cloudflare, server] }
  agent.run:        { tierPreference: [server] }
  agent.thoughts:   { tierPreference: [cloudflare, server] }
  edge.session:     { tierPreference: [cloudflare, server] }
  vault.lock:       { tierPreference: [server], critical: true }
  auth.token:       { tierPreference: [server, cloudflare], critical: true }

subscriptions:
  - { uri: 'quilt://server-canon/vector#embedding', to: cf-edge-eu }
  - { uri: 'quilt://server-canon/vector#embedding', to: cf-edge-us }
  - { uri: 'quilt://server-canon/vector#embedding', to: cf-edge-apac }
